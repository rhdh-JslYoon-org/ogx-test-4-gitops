# Route for Streamlit UI Application (OpenShift)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/instance: ogx-test-4
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ogx-test-4
  name: ogx-test-4
spec:
