apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  argocd/app-name: ogx-test-4
  janus-idp.io/tekton: ogx-test-4
  backstage.io/kubernetes-id: ogx-test-4
  backstage.io/kubernetes-namespace: rhdh-app
  app.kubernetes.io/part-of: ogx-test-4
resources:
  - initialize-namespace/
  # RBAC for MCP Server
  - rbac-mcp-server.yaml
  # ConfigMaps (run.yaml and ingestion-config.yaml are baked into images)
  - configmap-app.yaml
  - configmap-ogx-env.yaml
  # NOTE: Secrets are user-managed - see TechDocs for example
  # OGX Server
  - deployment-ogx.yaml
  - service-ogx.yaml
  # Kubernetes MCP Server
  - deployment-mcp-server.yaml
  - service-mcp-server.yaml
  # Main Streamlit Application
  - deployment.yaml
  - service.yaml
  - route.yaml
  # Ollama Server (for inference and/or safety shields)
  - deployment-ollama.yaml
  - service-ollama.yaml
  - pvc-ollama.yaml

